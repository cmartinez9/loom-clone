# Packaging. macOS only — captain decision 4, and there is no cross-platform
# hedging anywhere in this repo.
#
# `appId` MUST stay `com.github.cmartinez9.loom-clone`. macOS TCC keys every
# permission grant on it; changing it re-prompts for Screen Recording, Camera and
# Microphone, silently produces black frames until they are granted again, and
# requires a manual System Settings trip plus a relaunch for Accessibility
# (research report §7, trap 7). `apps/main/src/identity.ts` is the single
# declaration and `apps/main/test/identity.test.ts` fails the build if either
# copy drifts.
appId: com.github.cmartinez9.loom-clone
productName: Loom Clone
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

# Nothing is resolved from node_modules at runtime: esbuild and Vite bundle every
# workspace package into dist/.
files:
  - dist/**/*
  - package.json

asar: true

# `dist/native/loom-input-sampler` is a Mach-O executable the main process spawns
# (phase 5). A binary inside the asar archive cannot be `exec`'d, so it is unpacked
# into `app.asar.unpacked/`, where the signer can reach it. `spawn` is not asar-aware
# — it hands the literal path to `uv_spawn` — so the path is rewritten by
# `unpackedHelperPath()`; `__dirname/../native` alone would point inside the archive
# and the spawn would fail. Its Accessibility grant is inherited from the app bundle:
# macOS attributes a TCC request to the *responsible* process, which for a child of
# Loom Clone is Loom Clone. That is exactly why the helper does not need — and must
# not have — a TCC identity of its own.
asarUnpack:
  - dist/native/**

mac:
  category: public.app-category.video
  # Captain decision 7 (`data/loom-scope/decision-macos-floor.md`). Below 14 the
  # app would have to ship a CoreAudio HAL plug-in, an admin password prompt and a
  # coreaudiod restart to capture system audio.
  minimumSystemVersion: '14.0'
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSMinimumSystemVersion: '14.0'
    NSHighResolutionCapable: true
    # TCC purpose strings. The app does not ask for any of these yet — capture is
    # phase 1 and the first-run permission flow is phase 2, which owns the final
    # copy. They are declared here from the first commit because a *missing*
    # purpose string is not a prompt the user declines, it is an immediate crash.
    NSCameraUsageDescription: >-
      Loom Clone records your camera into the recording you are making. The video
      stays on this Mac.
    NSMicrophoneUsageDescription: >-
      Loom Clone records your microphone into the recording you are making. The
      audio stays on this Mac.
