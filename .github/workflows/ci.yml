# CI.
#
# macOS runner, because this is a macOS-only app (captain decision 4) and the
# phase 0 gate — killing a process mid-write and proving no torn file — is a
# statement about APFS and macOS process semantics, not about "some filesystem".
# Running it on Linux would pass without testing the thing we claim.
name: ci

# A commit is verified exactly once, and that is a measurement decision rather than
# a thrift one.
#
# `vitest.config.ts` sets `fileParallelism: false` because three of these gates time
# the machine they run on — the phase-5 sampler's 120 Hz, phase 6's worst-frame budget
# and phase 3's twenty-minute A/V sync — and two of them on one 3-vCPU runner measure
# each other. That rule was being kept inside a run and broken outside it: with
# `push: ['**']` alongside `pull_request`, every commit on a branch with an open PR
# started **two** full runs of this workflow. They land in different `concurrency`
# groups — `refs/heads/<branch>` against `refs/pull/<n>/merge` — so neither cancels
# the other, and both then ran `npm test`, and so the phase-6 gate, at the same
# instant against the same shared pool of macOS hosts. Observed on 2026-08-05: the two
# runs of d26016c overlapped for the whole of both gates and reported a single frame at
# 21.3 ms and at 123.6 ms, against p99s of 3.5 ms and 6.2 ms — the shape of a host that
# took the renderer away, not of a frame that did the work.
#
# So branches are covered by the `pull_request` run, which fires on `synchronize` for
# every push to an open PR and measures the merge result rather than the branch tip,
# and `push` is kept for `main` alone. Nothing that was verified stops being verified;
# it stops being verified twice over, concurrently, by the two jobs least able to
# share a host.
#
# That closed one of the two ways this workflow ran the phase-6 gate beside a busy
# macOS host, and left the other: `verify` and `mutation` are both `macos-14`, both
# fire on every pull request, and with nothing between them they start in the same
# second. `verify:mutation` is the heaviest thing this repo runs — it re-runs the
# SIGKILL crash test, drives `/usr/bin/avconvert` through `media-part.test.ts`, and
# launches the phase-4 and phase-11 Electron gates, once per mutation — and a
# `macos-14` job is a VM on shared Apple hardware whose GPU the gate's own renderer
# string names out loud ("Apple Paravirtual device"). Two of them can land on one
# physical Mac, and on 2026-08-06 they did: `verify` measured the phase-6 gate from
# 05:33:56 to 05:34:21 while `mutation` was inside two `avconvert` transcodes and the
# crash test. The gate came back with a **GPU** composite of 18.08 ms median scrubbing
# and 22.97 ms playing, against 2.37–2.48 ms on the three previous runs of the same
# gate on the same runner class, while its CPU frame body stayed inside §8's budget
# (worst 3.50 ms, 0 of 160 frames over). What failed was not a time: one playback
# readback came back holding an all-dark frame-code band between two correct ones,
# with no miss and no seek in that phase — a composite that did not reflect the
# playhead, on a GPU running seven frames behind the loop that fed it.
#
# So `mutation` waits for `verify` rather than racing it. The second reason is that
# the proof is only a proof over a green tree: `scripts/mutation-check.mjs` reads
# "this test file exited non-zero" as "the mutation was caught", so every mutation
# aimed at a file that was already failing is caught vacuously. The cost is that a
# pull request's wall clock becomes `verify` + `mutation` instead of the longer of
# them, and that a red `verify` skips the mutation proof — which is the run whose
# answer would have meant nothing anyway.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # electron 43 ships no install script: the ~100 MB binary is fetched lazily by
      # the first `require('electron')`, and the only one in this suite is the phase 6
      # gate. Left alone, that download and its ~250 MB extraction finish two seconds
      # before the one test here that is a stopwatch, so the page-cache flush and
      # macOS's first-launch signature scan of a freshly written Electron.app run
      # straight through its measurement window. `vitest.config.ts` says why that gate
      # does not share the machine; this is the other half of not sharing it.
      - name: Fetch the Electron binary
        run: node -e "require('electron')"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      # Proves the shell actually builds into a runnable app, which is the other
      # half of the phase 0 deliverable. Packaging (electron-builder) is not run
      # here; `apps/main/test/identity.test.ts` asserts its contract instead.
      - name: Build
        run: npm run build

  # A gate is only worth what its mutation proof says it is: break capture and the
  # timeline model one way at a time — phase 1's crash gate, phase 3's A/V sync gate,
  # phase 4's camera-unplug gate and phase 7's two — and every one has to make a test
  # fail. Kept off the per-push job because it re-runs the crash test ten times; a
  # pull request is the point at which "do these gates still measure anything" has to
  # be answered.
  #
  # `needs: verify` is the same measurement rule as the one at the top of this file,
  # applied to the last place it was still being broken. `vitest.config.ts` keeps the
  # three stopwatch gates off each other inside a run; the `push`/`pull_request` split
  # above keeps two runs of the workflow off each other. This job was the remaining
  # overlap: it starts at the same instant as `verify`, on the same shared pool of
  # macOS hosts, and spends its whole life launching Electron — the crash gate ten
  # times, the A/V sync gate, the camera-unplug gate, both golden gates — while
  # `verify` is running the phase-6 gate, which judges its worst single frame with no
  # allowance and cannot tell a busy host from the defect it exists to catch. Observed
  # on 2026-08-06: the mutation job entered `npm run verify:mutation` 17 s before the
  # phase-6 gate's window and the gate reported one frame at 29.10 ms against a p99 of
  # 1.80 ms and a 2.20 ms worst frame on the run before it, with the gate's own
  # pure-arithmetic host control stretched from 8.50 ms to 11.40 ms in the same frames
  # — the shape of a host that took the renderer away.
  #
  # Serialising costs a PR the two jobs in sequence rather than in parallel (about
  # 4 + 7 minutes as measured, against each job's own timeout of 20 and 25). Nothing
  # stops being verified; it stops being measured next to a machine we are also
  # loading on purpose.
  mutation:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Mutation proof
        run: npm run verify:mutation
