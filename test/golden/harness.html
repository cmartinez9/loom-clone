<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; connect-src loom:; img-src 'self' data:;"
    />
    <title>loom-clone — phase 11 golden gate</title>
    <style>
      /* The Pressroom UI face, self-hosted exactly as the app serves it. The atlas
         is rasterised from whatever `document.fonts` has resolved, so this is not
         decoration: without it every label in the gate is set in a fallback. */
      @font-face {
        font-family: 'Mona Sans';
        src: url('mona-sans-normal.woff2') format('woff2');
        font-weight: 200 900;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        background: #14110f;
        color: #f2ece4;
        font:
          13px ui-monospace,
          monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <script type="module" src="harness.js"></script>
  </body>
</html>
